name: Build & Package — Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-package:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup MSVC toolchain (Visual Studio / MSVC)
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Install Skia
        # This step uses bash like the upstream workflow so it can source laf/misc/skia-url.sh
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]] ; then
            this_dir=$(cygpath "${{ github.workspace }}")
          else
            this_dir="${{ github.workspace }}"
          fi
          if [ -f "$this_dir/laf/misc/skia-url.sh" ]; then
            skia_url=$(source $this_dir/laf/misc/skia-url.sh | xargs)
            if [ -n "$skia_url" ]; then
              skia_file=$(basename $skia_url)
              curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
              unzip -q "$skia_file" -d skia || true
            else
              echo "skia_url is empty, skipping skia download"
            fi
          else
            echo "laf/misc/skia-url.sh not found; skipping skia download"
          fi

      - name: Configure CMake
        shell: bash
        run: |
          enable_ccache=off
          laf_backend=skia
          enable_scripting=on
          skia_arch=x64

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=ON \
            -DENABLE_SCRIPTING=${enable_scripting} \
            -DENABLE_CCACHE=${enable_ccache} \
            -DLAF_BACKEND=${laf_backend} \
            -DSKIA_DIR=$(realpath skia) \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)

      - name: Build (Ninja)
        shell: bash
        run: |
          cd build
          ninja -j 2

      - name: Run C++ tests
        shell: bash
        run: |
          cd build
          ctest --output-on-failure || true

      - name: Package DLLs and binaries into ZIP (Windows)
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $out = Join-Path $workspace "artifacts"
          if (-Not (Test-Path $out)) { New-Item -ItemType Directory -Path $out | Out-Null }
          $binOut = Join-Path $out "bin"
          if (Test-Path $binOut) { Remove-Item -Recurse -Force $binOut }
          New-Item -ItemType Directory -Path $binOut | Out-Null

          Write-Host "Copying build binaries (if any)..."
          $buildBin = Join-Path $workspace "build\bin"
          if (Test-Path $buildBin) {
            Get-ChildItem -Path $buildBin -Recurse -File | Copy-Item -Destination $binOut -Force
          } else {
            Write-Host "build\\bin not found"
          }

          Write-Host "Collecting Skia DLLs (if present)..."
          $skiaDirs = Get-ChildItem -Path $workspace -Directory -Filter skia -Recurse -ErrorAction SilentlyContinue
          foreach ($d in $skiaDirs) {
            Get-ChildItem -Path $d.FullName -Filter *.dll -Recurse -File -ErrorAction SilentlyContinue | Copy-Item -Destination $binOut -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Collecting OpenSSL (libcrypto/libssl) DLLs from workspace..."
          Get-ChildItem -Path $workspace -Include 'libcrypto-3*.dll','libssl-3*.dll' -Recurse -File -ErrorAction SilentlyContinue | Copy-Item -Destination $binOut -Force -ErrorAction SilentlyContinue

          Write-Host "Also looking for DLLs in third_party and laf..."
          Get-ChildItem -Path (Join-Path $workspace 'third_party') -Filter *.dll -Recurse -File -ErrorAction SilentlyContinue | Copy-Item -Destination $binOut -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path (Join-Path $workspace 'laf') -Filter *.dll -Recurse -File -ErrorAction SilentlyContinue | Copy-Item -Destination $binOut -Force -ErrorAction SilentlyContinue

          Write-Host "Listing artifacts/bin contents:"
          Get-ChildItem -Path $binOut -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

          $tag = if ($env:TAG -and $env:TAG -ne '') { $env:TAG } else { 'no-tag' }
          $zipPath = Join-Path $out "aseprite-$tag-windows.zip"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path (Join-Path $binOut '*') -DestinationPath $zipPath -Force
          Write-Host "Created ZIP: $zipPath"

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows-zip
          path: artifacts/

      - name: Create GitHub Release (if triggered by tag)
        id: create_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/aseprite-${{ github.ref_name }}-windows.zip
          asset_name: aseprite-${{ github.ref_name }}-windows.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
